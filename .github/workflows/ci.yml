name: Backend CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loopbill
          POSTGRES_PASSWORD: loopbill_secret
          POSTGRES_DB: loopbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://loopbill:loopbill_secret@localhost:5432/loopbill_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Vitest Test Suite
        env:
          DATABASE_URL: postgresql://loopbill:loopbill_secret@localhost:5432/loopbill_test?schema=public
          TEST_DATABASE_URL: ******localhost:5432/loopbill_test?schema=public
          TEST_APP_DATABASE_URL: ******localhost:5432/loopbill_test?schema=public
          JWT_SECRET: ci_test_jwt_secret_min_32_characters_long_ci
          COOKIE_SECRET: ci_test_cookie_secret_16
          NODE_ENV: test
        run: npm test
